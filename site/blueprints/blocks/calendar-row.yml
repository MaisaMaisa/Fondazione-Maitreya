name: Calendar Row
icon: calendar
fields:
  items:
    label: Calendar
    type: structure
    min: 1
    max: 3
    fields:
      image:
        label: Image
        type: files
        multiple: false
        query: page('assets').images
        uploads:
          parent: page('assets')
      date:
        label: Date
        type: text
      title:
        label: Title
        type: text
      subtitle:
        label: Subtitle
        type: text
      link:
        label: Link (optional)
        type: link
        help: Leave empty for a non-clickable card