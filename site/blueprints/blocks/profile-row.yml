name: Profile Row
icon: users
fields:
  items:
    label: Profiles
    type: structure
    min: 1
    max: 4
    fields:
      image:
        label: Photo
        type: files
        multiple: false
        query: page('assets').images
        uploads:
          parent: page('assets')
      name:
        label: Name
        type: text
      role:
        label: Role
        type: text
      link:
        label: Link (optional)
        type: link
        help: Leave empty for a non-clickable card