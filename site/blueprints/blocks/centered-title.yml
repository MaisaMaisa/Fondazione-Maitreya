name: Centered Title
icon: title

fields:
  heading_text:
    label: Title
    type: textarea
    size: medium
    placeholder: "Section title"
    buttons: false

  level:
    label: Heading level
    type: select
    options:
      h2: H2 (section title)
      h3: H3 (subsection)
      body: Body text
    default: h2