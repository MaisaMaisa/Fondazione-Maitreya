name: PDF Buttons
icon: page
fields:
  documents:
    label: Documents
    type: structure
    fields:
      label:
        label: Button label
        type: text
        placeholder: "Paramita Nr.1"
      file:
        label: PDF file
        type: files
        multiple: false
        layout: cards
        query: page('documents').files
        uploads:
          parent: page('documents')
        accept: application/pdf
    min: 1