title: Default Page

fields:
  heading_subtitle:
    label: Heading subtitle
    type: textarea
    size: small
    help: Separate paragraphs with a blank line.
    default: "Fondata nel 1982, Fondazione Maitreya promuove in Italia la conoscenza e la pratica del Dharma buddhista, in modo non settario e aperto a tutti."

  blocks:
    type: blocks
    fieldsets:
      # Core content
      - paragraph
      - text-image
      - centered-title
      - spacer

      # Rows / layout collections
      - vertical-row
      - calendar-row
      - profile-row
      - two-column-text
      - event

      # Links & buttons
      - centered-link
      - two-column-links
      - pdf-collection

      # Media & data
      - slideshow
      - charts-report

      # money
      - donate-button
      - donation-buttons
      - donation-progress