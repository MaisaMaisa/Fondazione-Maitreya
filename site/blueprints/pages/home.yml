# This tells the Panel: "on the Home page, show a Blocks field that lets the editor insert Text, Centers Row, Events Row, or Team Row blocks, in any order."

title: Home

fields:
  heading_subtitle:
    label: Heading subtitle
    type: textarea
    size: large
    help: Separate paragraphs with a blank line.
    default: "Fondata nel 1982, Fondazione Maitreya promuove in Italia la conoscenza e la pratica del Dharma buddhista, in modo non settario e aperto a tutti."

  blocks:
    type: blocks
    fieldsets:
      - text
      - centered-title
      - spacer
      - vertical-row
      - calendar-row
      # - profile-row